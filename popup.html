<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 14px 16px; font: 13px system-ui, sans-serif; background: #fff; color: #202124; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    section + section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e8eaed; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    #value { font-variant-numeric: tabular-nums; color: #5f6368; }
    input[type=range] { width: 100%; accent-color: #1a73e8; }
    button { padding: 6px; border: 0; border-radius: 6px; background: #f1f3f4; color: #202124; cursor: pointer; }
    button:hover { background: #e8eaed; }
    #reset, #pinCurrent { width: 100%; margin-top: 8px; }
    #pinCurrent { background: #1a73e8; color: #fff; }
    #pinCurrent:hover { background: #1765cc; }
    #pins { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
    #pins li { display: flex; align-items: center; gap: 6px; }
    #pins a { flex: 1; min-width: 0; padding: 6px 4px; border-radius: 6px; color: #1a0dab; text-decoration: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #pins a:hover { background: #f1f3f4; }
    #pins button { flex: none; width: 24px; height: 24px; padding: 0; border-radius: 50%; background: none; color: #5f6368; font-size: 16px; line-height: 1; }
    #pins button:hover { background: #e8eaed; }
    #empty { margin: 0; color: #5f6368; }
  </style>
</head>
<body>
  <section>
    <h1>Pinned docs</h1>
    <ul id="pins"></ul>
    <p id="empty">Nothing pinned yet. Hover a document on the Docs home page and click its pin.</p>
    <button id="pinCurrent" hidden></button>
  </section>
  <section>
    <h1>Preview height</h1>
    <div class="row"><span>Thumbnail height</span><span id="value"></span></div>
    <input id="slider" type="range" min="60" max="400" step="10">
    <button id="reset">Reset to Google's default</button>
  </section>
  <script src="popup.js"></script>
</body>
</html>
